<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiniela</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @media (prefers-color-scheme: dark) {
      body { background-color: #0f172a; color: #f8fafc; }
      .bg-white { background-color: #1e293b !important; color: #f8fafc !important; }
      .bg-slate-100 { background-color: #0f172a !important; }
      .bg-slate-50 { background-color: #334155 !important; color: #f8fafc !important; }
      .bg-gray-50 { background-color: #334155 !important; color: #f8fafc !important; }
      .border { border-color: #475569 !important; }
      .text-gray-800, .text-gray-700, .text-gray-600 { color: #cbd5e1 !important; }
      .text-gray-500 { color: #94a3b8 !important; }
      input, select { background-color: #334155 !important; color: #ffffff !important; border-color: #475569 !important; }
    }
  </style>
</head>

<body class="bg-slate-100 text-gray-800 font-sans pb-12 transition-colors duration-200">

  <!-- ENCABEZADO -->
  <header class="bg-blue-900 text-white p-4 shadow-md text-center">
    <h1 class="text-2xl font-bold tracking-wide">⚽ Quiniela</h1>
    <p class="text-xs text-blue-200 mt-1">
      Borja · Carlos · Itziar · Jose · Quique · Currás · García · Rodríguez
    </p>
  </header>

  <!-- PANTALLA 1: ACCESO DE JUGADORES -->
  <section id="pantalla-login"
    class="max-w-md mx-auto my-12 p-6 bg-white rounded-xl shadow-lg border border-slate-200 text-center space-y-6">

    <div>
      <div class="text-4xl mb-2">🔐</div>
      <h2 class="text-xl font-bold text-blue-900">Acceso de Jugadores</h2>
      <p class="text-xs text-gray-500 mt-1">
        Identifícate para entrar en la Quiniela
      </p>
    </div>

    <div class="space-y-4 text-left">

      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">
          Tu Nombre
        </label>

        <select id="login-select-jugador"
          onchange="seleccionarJugador()"
          class="p-2.5 border rounded-lg bg-gray-50 font-semibold text-blue-900 w-full">

          <option value="">-- Selecciona tu Nombre --</option>
          <option value="Borja">Borja</option>
          <option value="Carlos">Carlos</option>
          <option value="Itziar">Itziar</option>
          <option value="Jose">Jose</option>
          <option value="Quique">Quique</option>
          <option value="Currás">Currás</option>
          <option value="García">García</option>
          <option value="Rodríguez">Rodríguez</option>

        </select>
      </div>

      <div id="login-sec-pin" class="hidden space-y-3">

        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">
          PIN / Clave (4 dígitos)
        </label>

        <input type="password"
          id="login-input-pin"
          maxlength="4"
          placeholder="****"
          class="p-2.5 border rounded-lg bg-gray-50 font-semibold text-center tracking-widest w-full">

        <p id="login-msg-status" class="text-xs font-medium text-slate-500">
          Introduce tu PIN de 4 dígitos para acceder o registrarlo si es tu primera vez.
        </p>

        <div class="flex gap-2 pt-2">

          <button type="button"
            id="btn-entrar"
            onclick="iniciarSesion()"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition shadow text-xs">
            Entrar a la Quiniela
          </button>

          <button type="button"
            id="btn-registrar-pin"
            onclick="registrarPINLogin()"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition shadow text-xs">
            Registrar Mi PIN
          </button>

        </div>
      </div>
    </div>
  </section>

  <!-- PANTALLA 2: CONTENIDO PRINCIPAL -->
  <main id="pantalla-app" class="hidden max-w-4xl mx-auto p-4 space-y-6">

    <!-- USUARIO ACTIVO -->
    <div class="bg-blue-50 border border-blue-200 p-3 rounded-xl flex items-center justify-between">

      <span class="text-xs font-semibold text-blue-900">
        👤 Sesión iniciada como:
        <span id="lbl-usuario-activo" class="font-bold text-blue-700">...</span>
      </span>

      <button type="button"
        onclick="cerrarSesion()"
        class="text-xs text-red-600 hover:underline font-bold">
        Cerrar Sesión ✖
      </button>

    </div>

    <!-- PESTAÑAS -->
    <nav class="bg-slate-200 p-1.5 rounded-xl border border-slate-300 grid grid-cols-2 sm:grid-cols-4 gap-2">

      <button type="button"
        id="tab-btn-pronostico"
        onclick="cambiarPestanaPrincipal('pronostico')"
        class="py-2.5 px-2 text-xs font-bold rounded-lg border text-center transition bg-blue-600 text-white border-blue-600 shadow">
        📝 Pronóstico Jornada
      </button>

      <button type="button"
        id="tab-btn-jornada"
        onclick="cambiarPestanaPrincipal('jornada')"
        class="py-2.5 px-2 text-xs font-bold rounded-lg border text-center transition bg-white text-gray-700 border-gray-200 hover:bg-gray-50">
        🥇 Clasificación Jornada
      </button>

      <button type="button"
        id="tab-btn-acumulada"
        onclick
